name: Validate AI Teams

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate index JavaScript
        run: |
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const scripts = [...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)]
            .map(m => m[1])
            .filter(x => x.trim());
          if (!scripts.length) throw new Error('No inline scripts found');
          scripts.forEach((code, i) => {
            try { new Function(code); }
            catch (err) { throw new Error('Inline script ' + i + ' syntax error: ' + err.message); }
          });
          const required = [
            ['Gateway origin guard', 'const APP_ORIGIN ='],
            ['Gateway rate limiter', "consume_ai_gateway_rate_limit"],
            ['Gateway method guard', "فقط POST مجاز است"],
            ['Drawer without history mutation', "r.onclick=openRight;l.onclick=openLeft;sync();"],
            ['human-agent guard', "a.kind==='human'"],
            ['AI-only dialogue', "a.enabled&&a.kind!=='human'"],
            ['Horde retry', 'for(let attempt=1;attempt<=3;attempt++)'],
            ['outer finalResult', "let finalResult='';"],
            ['anonymous Horde key', 'Bearer 0000000000'],
            ['Horde chat endpoint', 'oai.aihorde.net/v1/chat/completions']
          ];
          for (const [name, needle] of required) {
            if (!html.includes(needle)) throw new Error('Missing invariant: ' + name);
          }
          const duplicateIds = ids => ids.filter((id,i)=>ids.indexOf(id)!==i);
          const ids = [...html.matchAll(/\\bid=["']([^"']+)["']/g)].map(m=>m[1]);
          if (duplicateIds(ids).length) throw new Error('Duplicate HTML ids: ' + duplicateIds(ids).join(', '));
          console.log('Validated', scripts.length, 'inline scripts, unique IDs, and all critical invariants.');
          NODE

      - name: Validate Gateway security invariants
        run: |
          grep -q "Access-Control-Allow-Origin': APP_ORIGIN" supabase/functions/ai-gateway/index.ts
          grep -q "consume_ai_gateway_rate_limit" supabase/functions/ai-gateway/index.ts
          grep -q "oai.aihorde.net/v1/chat/completions" supabase/functions/ai-gateway/index.ts
          ! grep -q "oai.stablehorde.net/v1/chat/completions" supabase/functions/ai-gateway/index.ts
          grep -q "expires_at" supabase/functions/github-gateway/index.ts
          grep -q "source.length>2000000" supabase/functions/github-gateway/index.ts
          echo "Gateway and GitHub security invariants passed."

      - name: Validate Supabase Edge Functions
        uses: denoland/setup-deno@v1
        with:
          deno-version: v2.x

      - name: Deno type check
        run: |
          deno check supabase/functions/ai-gateway/index.ts
          deno check supabase/functions/github-gateway/index.ts

      - name: Validate deployment workflow
        run: |
          test -f .github/workflows/pages.yml
          grep -q 'actions/deploy-pages@v4' .github/workflows/pages.yml
          echo "GitHub Pages deployment workflow is present."
