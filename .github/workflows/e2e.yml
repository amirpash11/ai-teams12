name: End-to-End AI Teams

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm install --no-save @playwright/test@1.63.0
          npx playwright install --with-deps chromium

      - name: Start static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory . >/tmp/ai-teams-http.log 2>&1 &
          echo $! >/tmp/ai-teams-http.pid
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/ai-teams-http.log
          exit 1

      - name: Run browser E2E
        run: npx playwright test tests/e2e/ai-teams.spec.mjs --workers=1

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

      - name: Stop static server
        if: always()
        run: |
          test -f /tmp/ai-teams-http.pid && kill $(cat /tmp/ai-teams-http.pid) || true
