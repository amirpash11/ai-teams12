name: Validate AI Teams

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate JavaScript and HTML structure
        run: |
          node -e "const fs=require('fs'); const html=fs.readFileSync('index.html','utf8'); const n=(html.match(/<script(?:\\s[^>]*)?>[\\s\\S]*?<\\/script>/gi)||[]).length; if(n<5) throw new Error('Expected app scripts'); const body=html.replace(/<script(?:\\s[^>]*)?>[\\s\\S]*?<\\/script>/gi,''); const ids=[...body.matchAll(/\\bid=[\"']([^\"']+)[\"']/g)].map(m=>m[1]); const dup=ids.filter((x,i)=>ids.indexOf(x)!==i); if(dup.length) throw new Error('Duplicate DOM IDs: '+dup.join(',')); console.log('HTML structure PASS; inline script blocks:',n)"
          for f in provider-manager.js cloud-storage.js github-storage.js google-drive-storage.js multiplayer.js workspace-manager.js ai-teams-v3.js; do node --check "$f"; done
          echo "External JavaScript syntax PASS"
      - name: Validate Gateway security invariants
        run: |
          grep -q "Access-Control-Allow-Origin': APP_ORIGIN" supabase/functions/ai-gateway/index.ts
          grep -q "consume_ai_gateway_rate_limit" supabase/functions/ai-gateway/index.ts
          grep -q "oai.aihorde.net/v1/chat/completions" supabase/functions/ai-gateway/index.ts
          ! grep -q "oai.stablehorde.net/v1/chat/completions" supabase/functions/ai-gateway/index.ts
          grep -q "upstreamHeaders" supabase/functions/ai-gateway/index.ts
          grep -q "retry-after" supabase/functions/ai-gateway/index.ts
          grep -q "x-ratelimit-remaining" supabase/functions/ai-gateway/index.ts
          grep -q "protocol !== 'https:'" supabase/functions/ai-gateway/index.ts
          grep -q "1200000" supabase/functions/ai-gateway/index.ts
          grep -q "expires_at" supabase/functions/github-gateway/index.ts
          grep -q '"Access-Control-Allow-Origin":APP_ORIGIN' supabase/functions/github-gateway/index.ts
          grep -q "Access-Control-Allow-Headers" supabase/functions/github-gateway/index.ts
          grep -q "APP_ORIGIN+new URL(req.url).pathname" supabase/functions/github-gateway/index.ts
          ! grep -q 'u.origin+u.pathname+"?action=oauth-callback"' supabase/functions/github-gateway/index.ts
          grep -q "source.length>2000000" supabase/functions/github-gateway/index.ts
          grep -q "contentLength" supabase/functions/github-gateway/index.ts
          grep -q "Invalid repository or path" supabase/functions/github-gateway/index.ts
          grep -q "aiTeamsImportState" index.html
          grep -q "normalizeStateShape();" index.html
          grep -q "core.importState(validateState(r.data.state))" cloud-storage.js
          grep -q "importState:window.aiTeamsImportState" provider-manager.js
          grep -q "aiTeamsEnsureProviders" provider-manager.js
          grep -q "if(typeof window.callAgent!=='function')window.callAgent=universalCallAgent;" provider-manager.js
          grep -q "normalizeStateShape" index.html
          grep -q "compactContext" index.html
          grep -q "compactText" supabase/functions/ai-gateway/index.ts
          grep -q "Content-Security-Policy" index.html
          grep -q "function safeAgentId" index.html
          grep -q "function stripBrowserSecrets" index.html
          grep -q "stripBrowserSecrets(p)" index.html
          grep -q "core.importState(x.project)" github-storage.js
          grep -q "@media(max-width:920px)" index.html
          grep -q "@media(max-width:520px)" index.html
          grep -q "chat-first-home" index.html
          grep -q "body.chat-first-home .right-home-options .topbar" index.html
          grep -q "s.classList.toggle('open',!h)" index.html
          grep -q "getItem(__leftDrawerState.key)!=='0'" index.html
          grep -q "const RETRY_DELAYS=" github-storage.js
          grep -q "async function fetchWithRetry(url,init)" github-storage.js
          grep -q "transcript=compactContext(transcript,30000)" index.html
          test -f ai-teams-v3.js
          node -e "new Function(require('fs').readFileSync('ai-teams-v3.js','utf8')); console.log('AI Teams v3 syntax PASS')"
          echo "Gateway and GitHub security invariants passed."

      - name: Validate Supabase Edge Functions
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Deno type check
        run: |
          deno check supabase/functions/ai-gateway/index.ts
          deno check supabase/functions/github-gateway/index.ts

      - name: Public provider smoke tests
        run: |
          set -euo pipefail
          curl -fsS --retry 4 --retry-all-errors --max-time 20 https://openrouter.ai/api/v1/models -o /tmp/openrouter-models.json
          curl -fsS --retry 4 --retry-all-errors --max-time 20 -H 'Authorization: Bearer 0000000000' https://oai.aihorde.net/v1/models -o /tmp/horde-models.json
          node <<'NODE'
          const fs = require('fs');
          const openrouter = JSON.parse(fs.readFileSync('/tmp/openrouter-models.json','utf8'));
          const horde = JSON.parse(fs.readFileSync('/tmp/horde-models.json','utf8'));
          if (!Array.isArray(openrouter.data) || openrouter.data.length < 1) throw new Error('OpenRouter model catalog is empty');
          if (!Array.isArray(horde.data) || horde.data.length < 1) throw new Error('AI Horde model catalog is empty');
          console.log('OpenRouter models:', openrouter.data.length);
          console.log('AI Horde models:', horde.data.length);
          NODE
          grep -q "openrouter/free" index.html
          grep -q "await ensureHordeModel(a)" index.html
          node <<'NODE'
          (async()=>{
          const fs = require('fs');
          const h = JSON.parse(fs.readFileSync('/tmp/horde-models.json','utf8'));
          const models = Array.isArray(h.data) ? h.data.map(x=>x?.id).filter(Boolean) : [];
          if (!models.length) throw new Error('No Horde model available for live inference test');
          const candidates = models.filter(x=>/llama|qwen|mistral|gemma|deepseek|phi|hermes|drummer/i.test(String(x))).slice(0,6);
          if(!candidates.length) candidates.push(models[0]);
          let passed=false, lastError='';
          for(const model of candidates){
            for(let attempt=1;attempt<=3;attempt++){
              const ctrl = new AbortController();
              const timer = setTimeout(()=>ctrl.abort(), 30000);
              try {
                const res = await fetch('https://oai.aihorde.net/v1/chat/completions', {
                  method:'POST',
                  headers:{'Content-Type':'application/json','Authorization':'Bearer 0000000000','X-Client':'AI-Teams-CI'},
                  body:JSON.stringify({model,messages:[{role:'user',content:'Reply with exactly: AI TEAMS LIVE OK'}],temperature:0,max_tokens:16}),
                  signal:ctrl.signal
                });
                const raw=await res.text();
                if(!res.ok){ lastError='HTTP '+res.status+' '+raw.slice(0,300); continue; }
                let data={}; try{data=JSON.parse(raw)}catch{}
                const out=data?.choices?.[0]?.message?.content||data?.choices?.[0]?.text||'';
                if(String(out).trim()){
                  console.log('AI Horde live inference PASS:', model, JSON.stringify(String(out).slice(0,200)), 'attempt', attempt);
                  passed=true; break;
                }
                lastError='empty inference response';
              }catch(e){lastError=String(e)}
              finally { clearTimeout(timer); }
              await new Promise(r=>setTimeout(r,1500));
            }
            if(passed)break;
          }
          if(!passed) throw new Error('AI Horde live inference failed after candidate retries: '+lastError);
          })().catch(err=>{console.error(err);process.exit(1)})
          NODE
          echo "Public provider endpoints and free-provider contracts passed."

      - name: Validate browser E2E suite
        run: |
          test -f tests/e2e/ai-teams.spec.mjs
          test -f .github/workflows/e2e.yml
          grep -q "@playwright/test@1.63.0" .github/workflows/e2e.yml
          grep -q "@supabase/supabase-js@2.117.2" cloud-storage.js
          grep -q "@supabase/supabase-js@2.117.2" github-storage.js
          grep -q "@supabase/server@1.9.0" supabase/functions/ai-gateway/index.ts
          grep -q "@supabase/server@1.9.0" supabase/functions/github-gateway/index.ts
          grep -q "desktop core controls and demo execution" tests/e2e/ai-teams.spec.mjs
          grep -q "mobile chat-first layout and drawer behavior" tests/e2e/ai-teams.spec.mjs
          echo "Browser E2E suite is present and pinned."
      
      - name: Validate deployment workflow
        run: |
          test -f .github/workflows/pages.yml
          grep -q 'actions/deploy-pages@v4' .github/workflows/pages.yml
          echo "GitHub Pages deployment workflow is present."
