name: Validate AI Teams

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate index JavaScript
        run: |
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const scripts = [...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)]
            .map(m => m[1])
            .filter(x => x.trim());
          if (!scripts.length) throw new Error('No inline scripts found');
          scripts.forEach((code, i) => {
            try { new Function(code); }
            catch (err) { throw new Error('Inline script ' + i + ' syntax error: ' + err.message); }
          });
          const required = [
            ['human-agent guard', "a.kind==='human'"],
            ['AI-only dialogue', "a.enabled&&a.kind!=='human'"],
            ['Horde retry', 'for(let attempt=1;attempt<=3;attempt++)'],
            ['outer finalResult', "let finalResult='';"],
            ['anonymous Horde key', 'Bearer 0000000000'],
            ['Horde chat endpoint', 'oai.stablehorde.net/v1/chat/completions']
          ];
          for (const [name, needle] of required) {
            if (!html.includes(needle)) throw new Error('Missing invariant: ' + name);
          }
          console.log('Validated', scripts.length, 'inline scripts and all critical invariants.');
          NODE

      - name: Validate deployment workflow
        run: |
          test -f .github/workflows/pages.yml
          grep -q 'actions/deploy-pages@v4' .github/workflows/pages.yml
          echo "GitHub Pages deployment workflow is present."
